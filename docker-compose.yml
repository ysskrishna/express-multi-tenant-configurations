services:
  express-seperate-schema:
    build:
      context: ./shared-db-seperate-schema
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://service_user:service_password@db:5432/seperate_schema_db
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3001\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    depends_on:
      db:
        condition: service_healthy
    profiles:
      - express-seperate-schema
  express-shared-schema:
    build:
      context: ./shared-db-shared-schema
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://service_user:service_password@db:5432/shared_schema_db
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3002\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - express-shared-schema
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=service_user
      - POSTGRES_PASSWORD=service_password
      - POSTGRES_DB=master_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_user -d master_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: